{% extends "base.html" %}
{% block title %}계정관리{% endblock %}
{% block body %}
<h1>계정 관리</h1>
<p class="sub">사용자 계정을 생성하고 권한(관리자/조회)을 설정합니다.</p>

<div class="card" style="margin-bottom:18px">
  <h3 style="margin:0 0 14px">새 계정 추가</h3>
  <form method="post" action="{{ url_for('users_add') }}">
    <div class="toolbar" style="margin-bottom:0">
      <input type="text" name="username" placeholder="아이디" style="max-width:200px" autocomplete="off">
      <input type="password" name="password" placeholder="비밀번호" style="max-width:200px" autocomplete="new-password">
      <select name="role" style="max-width:140px">
        <option value="viewer">조회 (viewer)</option>
        <option value="admin">관리자 (admin)</option>
      </select>
      <button class="btn btn-primary" type="submit">계정 생성</button>
    </div>
  </form>
</div>

<div class="card" style="padding:0;overflow:hidden">
  <table>
    <thead>
      <tr><th>아이디</th><th>권한</th><th>생성일</th><th style="text-align:right">관리</th></tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td><strong>{{ u.username }}</strong>{% if u.get('is_default') %} <span class="pill warn">기본비번</span>{% endif %}</td>
        <td>
          <form method="post" action="{{ url_for('users_role') }}" style="display:flex;gap:6px;align-items:center">
            <input type="hidden" name="username" value="{{ u.username }}">
            <select name="role" style="max-width:130px">
              <option value="viewer" {{ 'selected' if u.role=='viewer' }}>조회</option>
              <option value="admin" {{ 'selected' if u.role=='admin' }}>관리자</option>
            </select>
            <button class="btn btn-ghost btn-sm" type="submit">변경</button>
          </form>
        </td>
        <td class="mono" style="color:var(--muted)">{{ u.get('created_at','-') }}</td>
        <td>
          <div class="actions">
            <form method="post" action="{{ url_for('users_reset') }}" style="display:flex;gap:6px"
                  onsubmit="return confirm('{{ u.username }} 비밀번호를 변경하시겠습니까?');">
              <input type="hidden" name="username" value="{{ u.username }}">
              <input type="password" name="password" placeholder="새 비밀번호" style="max-width:150px" autocomplete="new-password">
              <button class="btn btn-ghost btn-sm" type="submit">비번변경</button>
            </form>
            <form method="post" action="{{ url_for('users_delete') }}"
                  onsubmit="return confirm('{{ u.username }} 계정을 삭제하시겠습니까?');" style="display:inline">
              <input type="hidden" name="username" value="{{ u.username }}">
              <button class="btn btn-danger btn-sm" type="submit"
                {{ 'disabled' if u.username==current_user }}>삭제</button>
            </form>
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
