{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block body %}
<h1>비밀번호 변경</h1>
<p class="sub">{{ current_user }} 계정의 비밀번호를 변경합니다.</p>
<div class="card">
  <form method="post">
    <div class="formgrid">
      <div class="field"><label>현재 비밀번호</label><input type="password" name="current" autocomplete="current-password"></div>
      <div class="field"><label>새 비밀번호</label><input type="password" name="new" autocomplete="new-password"></div>
      <div class="field"><label>새 비밀번호 확인</label><input type="password" name="new2" autocomplete="new-password"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">변경</button>
      <a class="btn btn-ghost" href="{{ url_for('index') }}">취소</a>
    </div>
  </form>
</div>
{% endblock %}
