{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="card login-card">
    <h1><span style="display:inline-block;width:14px;height:14px;background:var(--orange);border-radius:4px;margin-right:8px;vertical-align:baseline"></span>모니터링 자동발신</h1>
    <p class="sub" style="text-align:center">로그인이 필요합니다</p>
    <form method="post">
      <div class="formgrid">
        <div class="field">
          <label>아이디</label>
          <input type="text" name="username" autofocus autocomplete="username">
        </div>
        <div class="field">
          <label>비밀번호</label>
          <input type="password" name="password" autocomplete="current-password">
        </div>
      </div>
      <div class="form-actions" style="display:block;max-width:none">
        <button class="btn btn-primary" type="submit" style="display:block;width:100%;text-align:center">로그인</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
